name: ✨ Feature Request
description: 改善提案・新機能の要望はこちら
title: "[Feature] 改善提案のタイトル"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新しい機能の要望や改善提案をありがとうございます！
        可能な範囲で以下の項目を入力してください 🙏

  - type: input
    id: target
    attributes:
      label: 対象プロジェクト
      description: アプリ名 / yanak.dev / ゲーム開発プロジェクトなど
      placeholder: "例: AppName/ yanak.dev / XXXGame"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 提案内容（概要）
      description: どんな機能・改善を希望しているかを簡潔に書いてください。
      placeholder: |
        例:
        - テーマカラー切り替え機能が欲しい
        - yanak.dev に検索機能が欲しい
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 詳細（任意）
      description: 背景・期待する挙動・用途など、詳しい情報があれば記述してください。
      placeholder: |
        例:
        - 〇〇するのに集計情報があると便利。
        - 夜間は画面が眩しいので、ダークテーマに切り替えたい。
        - プロジェクト一覧が増えてきたので検索があると助かる。

  - type: textarea
    id: reason
    attributes:
      label: この改善が有用だと考える理由（任意）
      placeholder: |
        例:
        - 利用者の利便性向上につながる
        - 作業効率が上がる
        - よくある利用シーンに対応できる

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案（任意）
      description: 他の方法や別案があれば記述してください。

  - type: textarea
    id: notes
    attributes:
      label: その他メモ（任意）
      placeholder: "補足や関連Issueがあれば記述してください"
